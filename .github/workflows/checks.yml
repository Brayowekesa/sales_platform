# Actions are pinned to full commit SHAs (version in the comment); Dependabot proposes updates weekly.
# Runs on every push and pull request: tests (SQLite + PostgreSQL), code check, vulnerability scan, Docker build.
name: checks

on:
  push:
  pull_request:
  schedule:
    - cron: '17 5 * * 1'   # every Monday: catch newly published vulnerabilities

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.16-alpine3.24
        env:
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop
          POSTGRES_DB: shop_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U shop" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # the jobs don't push; don't leave the token in .git/config
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Code check (pyflakes)
        run: python -m pyflakes shop tests app.py
      - name: Tests on SQLite
        run: python -m pytest -q
      - name: Tests on PostgreSQL
        run: python -m pytest -q
        env:
          TEST_DATABASE_URL: postgresql://shop:shop@localhost:5432/shop_test

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # the jobs don't push; don't leave the token in .git/config
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install pip-audit
      - name: Known vulnerabilities in dependencies
        run: pip-audit -r requirements.txt

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # the jobs don't push; don't leave the token in .git/config
      - name: Docker image builds
        run: docker build -t shop-ci .
