# Weekly pull requests for outdated or vulnerable dependencies.
# Review each one: read the changelog, let the "checks" workflow pass, then merge.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker          # python base image in the Dockerfile
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose  # postgres and caddy images in docker-compose.yml
    directory: /
    schedule:
      interval: weekly
