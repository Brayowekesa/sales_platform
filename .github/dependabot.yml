# Weekly pull requests for outdated or vulnerable dependencies.
# Review each one: read the changelog, let the "checks" workflow pass, then merge.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-packages:               # one pull request for the small updates instead of many
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker          # python base image in the Dockerfile
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Moving to a new Python version (3.12 -> 3.13...) is a planned change, not a weekly bump
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: docker-compose  # postgres and caddy images in docker-compose.yml
    directory: /
    schedule:
      interval: weekly
    ignore:
      # A new PostgreSQL major version can't open the old data folder: it needs a
      # backup-and-restore upgrade (see docs/OPERATIONS.md), never an automatic bump
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
