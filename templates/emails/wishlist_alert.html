<!DOCTYPE html>
<html><body style="margin:0;padding:0;background:#f4f7fb;font-family:Arial,Helvetica,sans-serif;color:#0b2545;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f7fb;padding:24px 12px;"><tr><td align="center">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e1e8f0;">
  <tr><td style="background:#0b2545;padding:18px 24px;color:#ffffff;font-size:20px;font-weight:bold;">{{ SITE_NAME }}</td></tr>
  <tr><td style="padding:24px;">
    <h1 style="margin:0 0 10px;font-size:21px;">{{ headline }}</h1>
    <p style="margin:0 0 6px;font-size:15px;">Hi {{ name }},</p>
    <p style="margin:0 0 20px;font-size:15px;line-height:1.5;">{{ message }}</p>
    <a href="{{ url }}" style="display:inline-block;background:#f97316;color:#0b2545;font-weight:bold;text-decoration:none;padding:12px 22px;border-radius:8px;">See {{ product.name }}</a>
  </td></tr>
  <tr><td style="padding:14px 24px;background:#f8fafc;font-size:12px;color:#5b6b82;">You get this because the item is on your wishlist. Remove it from your wishlist to stop these alerts.</td></tr>
</table></td></tr></table>
</body></html>
