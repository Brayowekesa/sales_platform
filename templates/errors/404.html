{% extends "layout.html" %}

{% block title %}
    404 - Page Not Found
{% endblock %}

{% block content %}
<div class="container page-shell">
    <div class="error-card">
        <span class="error-icon"><i class="fas fa-compass" aria-hidden="true"></i></span>
        <p class="error-code">Error 404</p>
        <h1>Oops! Page Not Found.</h1>
        <p class="error-text">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>

        <form class="error-search" action="{{ url_for('store.search') }}" method="GET" role="search">
            <label for="error-search-input" class="sr-only">Search products</label>
            <input type="search" id="error-search-input" name="query" class="form-control" placeholder="Search products...">
            <button type="submit" class="btn btn-primary" aria-label="Search"><i class="fas fa-search" aria-hidden="true"></i></button>
        </form>

        <div class="error-actions">
            <a href="{{ url_for('store.index') }}" class="btn btn-primary">
                <i class="fas fa-home mr-2" aria-hidden="true"></i>Back to Home
            </a>
            <a href="{{ url_for('pages.page_contact') }}" class="btn btn-outline-secondary">
                <i class="fas fa-life-ring mr-2" aria-hidden="true"></i>Get help
            </a>
        </div>
    </div>
</div>
{% endblock %}
