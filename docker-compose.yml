# Production setup: the shop + PostgreSQL + Caddy (automatic HTTPS).
#   1. Copy .env.example to .env and fill in DOMAIN, POSTGRES_PASSWORD, FLASK_SECRET_KEY, email and M-Pesa
#   2. docker compose up -d --build
# Full guide: DEPLOY.md. Hardening notes: docs/OPERATIONS.md ("Container hardening").

# Keep container logs small: 5 x 10 MB per service, oldest deleted first (this is the log retention)
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16.16-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No "ports:" on purpose - the database is only reachable by the web container
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 200
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://shop:${POSTGRES_PASSWORD}@db:5432/shop
      PUBLIC_URL: https://${DOMAIN}  # links in emails/SMS
      TRUSTED_PROXY_COUNT: "1"     # Caddy sits in front
      SESSION_COOKIE_SECURE: "1"   # cookies only over HTTPS
      AUTO_MIGRATE: "0"            # the entrypoint migrates once before starting workers
      REQUIRE_ADMIN_2FA: "1"       # admins must use two-step login
      FLASK_DEBUG: "0"
    volumes:
      - uploads:/app/static/uploads
      - private_uploads:/app/private_uploads   # packing-proof photos/videos (not public)
    # Hardening: the code can't be changed at run time, no Linux capabilities, no privilege escalation
    read_only: true
    tmpfs:
      - /tmp:size=100m,mode=1777   # uploads being received (up to 30 MB each) are buffered here
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 512m
    pids_limit: 200
    logging: *logging
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env, e.g. shop.example.co.ke}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # HTTPS certificates
      - caddy_config:/config
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]   # listen on ports 80 and 443
    mem_limit: 128m
    pids_limit: 200
    logging: *logging
    healthcheck:
      # Caddy's admin API only listens inside the container (localhost:2019)
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - web

volumes:
  pgdata:
  uploads:
  private_uploads:
  caddy_data:
  caddy_config:
